<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>구구단 놀이</title>
  <script>
    // 위스퍼 AI를 고른 경우에만: 휴대폰 CPU 여러 개를 함께 쓰도록 보안 설정을 켜는 도우미
    // (켜면 위스퍼가 더 빨라져요. 구글 모드에서는 아무것도 안 해요)
    window.coi = {
      shouldRegister: () => { try { return localStorage.getItem("gugudan-engine") === "whisper"; } catch (e) { return false; } },
      coepCredentialless: () => true, // 구글 글꼴 같은 바깥 파일도 막지 않는 방식
      quiet: true,
    };
  </script>
  <script src="coi-serviceworker.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
  <style>
    /* ===== 색상과 기본 모양 ===== */
    :root {
      --bg: #fff8e7;
      --card: #ffffff;
      --ink: #3b2f2f;
      --sub: #8a7b6b;
      --main: #ff8a3d;
      --main-dark: #e86f1f;
      --good: #2bb673;
      --bad: #ef4b4b;
      --sky: #4aa8ff;
      --line: #f0e2c8;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .app {
      width: 100%;
      max-width: 520px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .screen { display: none; flex-direction: column; gap: 16px; flex: 1; }
    .screen.show { display: flex; }
    h1 { text-align: center; font-size: 40px; margin: 12px 0 0; color: var(--main-dark); }
    .hint { text-align: center; color: var(--sub); font-size: 18px; margin: 0; }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 4px 0 var(--line);
    }
    .card h2 { margin: 0 0 12px; font-size: 22px; }

    /* ===== 버튼 ===== */
    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      border-radius: 18px;
      font-size: 22px;
      padding: 14px;
      color: var(--ink);
      background: #f3ead8;
      box-shadow: 0 4px 0 #d9ccb2;
      transition: transform .05s;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9ccb2; }
    .big {
      background: var(--main);
      color: #fff;
      font-size: 30px;
      padding: 18px;
      box-shadow: 0 5px 0 var(--main-dark);
    }
    .big:active { box-shadow: 0 2px 0 var(--main-dark); }

    /* 단 고르기 버튼 */
    .dans { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .dans button.on { background: var(--sky); color: #fff; box-shadow: 0 4px 0 #2d86d9; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    .row button.on { background: var(--sky); color: #fff; box-shadow: 0 4px 0 #2d86d9; }
    #startBtn { position: sticky; bottom: 12px; z-index: 2; }
    .best { text-align: center; font-size: 20px; color: var(--sub); }

    /* ===== 게임 화면 ===== */
    .topbar { display: flex; justify-content: space-between; font-size: 20px; }
    .voice-btn { font-size: 20px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: 0 3px 0 var(--line); }
    .voice-btn.off { opacity: .5; }
    .pill { background: var(--card); border-radius: 999px; padding: 6px 14px; box-shadow: 0 3px 0 var(--line); }
    .progress { height: 12px; background: #f3ead8; border-radius: 999px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--good); transition: width .3s; }

    .question {
      position: relative;
      text-align: center;
      font-size: 72px;
      padding: 28px 8px;
      line-height: 1.1;
    }
    .question .answer-box {
      display: inline-block;
      min-width: 1.6em;
      border-bottom: 6px solid var(--main);
      color: var(--sky);
    }
    /* 맞았다/틀렸다 큰 표시 */
    .stamp {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 170px;
      pointer-events: none;
      opacity: 0;
    }
    .stamp.good { color: var(--good); animation: pop .7s; }
    .stamp.bad { color: var(--bad); animation: pop .7s; }
    @keyframes pop {
      0% { opacity: 0; transform: scale(.4); }
      25% { opacity: .9; transform: scale(1.1); }
      70% { opacity: .9; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    .card.good-flash { animation: goodFlash .6s; }
    .card.bad-flash { animation: badFlash .5s; }
    @keyframes goodFlash { 0%,100% { background: #fff; } 30% { background: #dbf7e9; } }
    @keyframes badFlash {
      0%,100% { background: #fff; transform: translateX(0); }
      20% { background: #ffe1e1; transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .message { text-align: center; font-size: 24px; min-height: 32px; }
    .message.good { color: var(--good); }
    .message.bad { color: var(--bad); }

    /* 마이크 상태 */
    .mic {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 18px; color: var(--sub); min-height: 28px; text-align: center;
    }
    .mic .dot { width: 14px; height: 14px; border-radius: 50%; background: #ccc; flex: none; }
    .mic.on .dot { background: var(--bad); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .heard { color: var(--ink); }

    /* 숫자 패드 */
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pad button { font-size: 30px; padding: 12px; background: var(--card); box-shadow: 0 4px 0 var(--line); }
    .pad .ok { background: var(--good); color: #fff; box-shadow: 0 4px 0 #1f8f59; }
    .pad .del { background: #f3ead8; }
    .quit { background: transparent; box-shadow: none; color: var(--sub); font-size: 18px; padding: 6px; }

    /* ===== 순서대로 외우기 화면 ===== */
    .big.learn { background: var(--sky); box-shadow: 0 5px 0 #2d86d9; font-size: 26px; }
    .big.learn:active { box-shadow: 0 2px 0 #2d86d9; }
    .dans.small { grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .dans.small button { font-size: 18px; padding: 8px 0; border-radius: 12px; }
    .stage-tabs button { font-size: 18px; padding: 10px 6px; }
    .learn-table { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
    .lrow {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 26px; padding: 4px 12px; border-radius: 14px; color: #b9ab98;
      transition: background .2s, transform .2s;
    }
    .lrow.past, .lrow.done, .lrow.help { color: var(--ink); }
    .lrow.cur { background: #fff1b8; color: var(--ink); font-size: 34px; transform: scale(1.02); }
    .lrow .ans { color: var(--sky); }
    .lrow .icon { font-size: 22px; min-width: 1.5em; text-align: right; }
    .ok-btn { background: var(--good); color: #fff; box-shadow: 0 4px 0 #1f8f59; }
    .ok-btn:active { box-shadow: 0 1px 0 #1f8f59; }
    #learnDone { text-align: center; }
    #learnDone h2 { font-size: 26px; margin: 6px 0 14px; }
    #learnDoneBtns { display: flex; flex-direction: column; gap: 10px; }
    .back-btn { font-size: 18px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: 0 3px 0 var(--line); }

    /* ===== 말 알아듣는 방법 (위스퍼) ===== */
    .engine-note { font-size: 16px; color: var(--sub); margin: 10px 2px 0; line-height: 1.4; }
    .whisper-status { margin-top: 10px; font-size: 18px; }
    .whisper-bar { height: 10px; background: #f3ead8; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .whisper-bar > div { height: 100%; width: 0; background: var(--sky); transition: width .2s; }

    /* ===== 결과 화면 ===== */
    .stars { text-align: center; font-size: 64px; letter-spacing: 6px; }
    .final-score { text-align: center; font-size: 64px; color: var(--main-dark); margin: 0; }
    .final-detail { text-align: center; font-size: 22px; margin: 0; }
    .wrong-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .wrong-list span { background: #ffe9e9; color: var(--bad); padding: 6px 12px; border-radius: 12px; font-size: 22px; }
    .new-best { text-align: center; font-size: 26px; color: var(--good); }
  </style>
</head>
<body>
<div class="app">

  <!-- ================= 1) 시작 화면 ================= -->
  <section id="startScreen" class="screen show">
    <h1>🐣 구구단 놀이</h1>
    <p class="hint">문제가 나오면 큰 소리로 답을 말해 보세요!</p>
    <button class="big learn" id="learnBtn">📖 처음이라면? 순서대로 외우기</button>

    <div class="card">
      <h2>① 몇 단을 할까요?</h2>
      <div class="dans" id="danButtons"></div>
      <div class="row" style="margin-top:10px">
        <button id="allDans">전부 고르기</button>
        <button id="noDans">전부 지우기</button>
      </div>
    </div>

    <div class="card">
      <h2>② 몇 문제를 풀까요?</h2>
      <div class="row" id="countButtons">
        <button data-count="10" class="on">10문제</button>
        <button data-count="20">20문제</button>
        <button data-count="30">30문제</button>
      </div>
    </div>

    <div class="card">
      <h2>③ 문제를 소리로 읽어 줄까요?</h2>
      <div class="row" id="voiceButtons">
        <button data-voice="on">🔊 읽어 주기</button>
        <button data-voice="off">🔇 조용히</button>
      </div>
    </div>

    <div class="card">
      <h2>④ 말은 누가 알아들을까요?</h2>
      <div class="row" id="engineButtons">
        <button data-engine="google">🌐 구글</button>
        <button data-engine="whisper">🧠 위스퍼 AI</button>
      </div>
      <div id="whisperBox" hidden>
        <div class="row" id="whisperSizeButtons" style="margin-top:10px">
          <button data-size="tiny">가볍게 (41MB)</button>
          <button data-size="base">똑똑하게 (77MB)</button>
        </div>
        <div class="whisper-status" id="whisperStatus"></div>
        <div class="whisper-bar" id="whisperBarWrap" hidden><div id="whisperBar"></div></div>
      </div>
      <p class="engine-note" id="engineNote"></p>
    </div>

    <p class="best" id="bestText"></p>
    <button class="big" id="startBtn">🎮 문제 풀기 시작 ▶</button>
    <p class="hint" id="micSupportText"></p>
  </section>

  <!-- ================= 2) 게임 화면 ================= -->
  <section id="gameScreen" class="screen">
    <div class="topbar">
      <span class="pill" id="countText">1 / 10</span>
      <span class="pill" id="comboText">🔥 0</span>
      <span class="pill">⭐ <b id="scoreText">0</b>점</span>
      <button class="voice-btn voice-toggle" id="voiceBtn" title="소리 켜기/끄기">🔊</button>
    </div>
    <div class="progress"><div id="progressBar"></div></div>

    <div class="card" id="questionCard">
      <div class="question">
        <span id="qText">2 × 3 =</span>
        <span class="answer-box" id="answerBox">?</span>
        <div class="stamp" id="stamp"></div>
      </div>
    </div>

    <div class="message" id="message"></div>
    <div class="mic" id="micStatus"><span class="dot"></span><span class="mic-text">마이크 준비 중…</span></div>

    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="del" data-key="del">⌫</button><button>0</button><button class="ok" data-key="ok">확인</button>
    </div>
    <button class="quit" id="quitBtn">그만하기</button>
  </section>

  <!-- ================= 순서대로 외우기 화면 ================= -->
  <section id="learnScreen" class="screen">
    <div class="topbar">
      <button class="back-btn" id="learnBackBtn">◀ 처음으로</button>
      <span class="pill" id="learnTitle">2단 외우기</span>
      <button class="voice-btn voice-toggle" title="소리 켜기/끄기">🔊</button>
    </div>
    <div class="dans small" id="learnDanButtons"></div>
    <div class="row stage-tabs">
      <button id="stage1Btn">① 듣고 따라 하기</button>
      <button id="stage2Btn">② 가리고 말하기</button>
    </div>

    <div class="card learn-table" id="learnTable"></div>
    <div class="message" id="learnMsg"></div>
    <div class="mic"><span class="dot"></span><span class="mic-text"></span></div>

    <div class="row" id="learnControls">
      <button id="replayBtn">🔊 다시 듣기</button>
      <button id="learnNextBtn" class="ok-btn">다음 ▶</button>
    </div>

    <div class="card" id="learnDone" hidden>
      <h2 id="learnDoneTitle"></h2>
      <div id="learnDoneBtns"></div>
    </div>
  </section>

  <!-- ================= 3) 결과 화면 ================= -->
  <section id="resultScreen" class="screen">
    <h1>🎉 다 풀었어요!</h1>
    <div class="card">
      <div class="stars" id="stars">⭐⭐⭐</div>
      <p class="final-score"><span id="finalScore">0</span>점</p>
      <p class="final-detail" id="finalDetail"></p>
      <p class="new-best" id="newBest"></p>
    </div>
    <div class="card" id="wrongCard">
      <h2>✏️ 다시 외워 볼까요?</h2>
      <div class="wrong-list" id="wrongList"></div>
    </div>
    <button class="big" id="againBtn">한 번 더! 🔁</button>
    <button id="homeBtn">처음으로</button>
  </section>

</div>

<script>
/* =====================================================================
   구구단 놀이 - 전체 동작 코드
   흐름: 시작 화면 → 문제 풀기(말하기 또는 숫자 누르기) → 결과 화면
   ===================================================================== */

// ---------- 설정 값 ----------
const POINT_CORRECT = 10;     // 맞히면 받는 점수
const POINT_FAST = 5;         // 빨리 맞히면 더 받는 점수
const FAST_SECONDS = 3;       // 몇 초 안에 맞히면 "빨라요"인지
const FEEDBACK_MS = 900;      // 맞았다/틀렸다를 보여주는 시간 (밀리초)

// ---------- 화면 요소 찾아두기 ----------
const $ = (id) => document.getElementById(id);
const screens = { start: $("startScreen"), game: $("gameScreen"), result: $("resultScreen"), learn: $("learnScreen") };

// ---------- 게임 상태 ----------
let selectedDans = new Set([2, 3, 4, 5, 6, 7, 8, 9]);
let questionCount = 10;
let questions = [];      // [{a, b}] 문제 목록
let current = 0;         // 지금 몇 번째 문제인지
let score = 0;
let combo = 0;
let correctCount = 0;
let wrongOnes = [];      // 틀린 문제 모음
let typed = "";          // 숫자 패드로 입력 중인 값
let questionStartTime = 0;
let busy = false;        // 정답 표시 중일 때는 입력을 받지 않음
let playing = false;
let voiceOn = loadVoiceSetting(); // 문제를 소리로 읽어 줄지

/* ===================== 1. 시작 화면 ===================== */

// 2단~9단 버튼 만들기
for (let d = 2; d <= 9; d++) {
  const btn = document.createElement("button");
  btn.textContent = d + "단";
  btn.classList.add("on");
  btn.onclick = () => {
    if (selectedDans.has(d)) selectedDans.delete(d); else selectedDans.add(d);
    btn.classList.toggle("on", selectedDans.has(d));
  };
  btn.dataset.dan = d;
  $("danButtons").appendChild(btn);
}
function setAllDans(on) {
  selectedDans = new Set(on ? [2, 3, 4, 5, 6, 7, 8, 9] : []);
  document.querySelectorAll("#danButtons button").forEach((b) => b.classList.toggle("on", on));
}
$("allDans").onclick = () => setAllDans(true);
$("noDans").onclick = () => setAllDans(false);

// 문제 수 버튼
document.querySelectorAll("#countButtons button").forEach((btn) => {
  btn.onclick = () => {
    questionCount = Number(btn.dataset.count);
    document.querySelectorAll("#countButtons button").forEach((b) => b.classList.toggle("on", b === btn));
  };
});

// 소리로 읽어 주기 켜기/끄기
function loadVoiceSetting() {
  try { return localStorage.getItem("gugudan-voice") !== "off"; } catch (e) { return true; }
}
function setVoice(on) {
  voiceOn = on;
  try { localStorage.setItem("gugudan-voice", on ? "on" : "off"); } catch (e) {}
  document.querySelectorAll("#voiceButtons button").forEach((b) =>
    b.classList.toggle("on", (b.dataset.voice === "on") === on));
  document.querySelectorAll(".voice-toggle").forEach((b) => {
    b.textContent = on ? "🔊" : "🔇";
    b.classList.toggle("off", !on);
  });
  if (!on) stopTalking();
}
document.querySelectorAll("#voiceButtons button").forEach((btn) => {
  btn.onclick = () => { setVoice(btn.dataset.voice === "on"); if (voiceOn) { unlockSound(); speak("안녕! 같이 구구단 해요"); } };
});
document.querySelectorAll(".voice-toggle").forEach((b) => { b.onclick = () => setVoice(!voiceOn); });

// 최고 점수 (이 컴퓨터/휴대폰에만 저장)
function getBest() {
  try { return Number(localStorage.getItem("gugudan-best") || 0); } catch (e) { return 0; }
}
function setBest(v) {
  try { localStorage.setItem("gugudan-best", String(v)); } catch (e) {}
}
function showBest() {
  const best = getBest();
  $("bestText").textContent = best > 0 ? `🏆 지금까지 최고 점수: ${best}점` : "";
}
showBest();

$("startBtn").onclick = () => {
  if (selectedDans.size === 0) { alert("단을 하나 이상 골라 주세요!"); return; }
  startGame();
};
$("againBtn").onclick = startGame;
$("homeBtn").onclick = () => { showScreen("start"); showBest(); };
$("quitBtn").onclick = () => { stopTalking(); stopGame(); showScreen("start"); showBest(); };

function showScreen(name) {
  Object.entries(screens).forEach(([key, el]) => el.classList.toggle("show", key === name));
}

/* ===================== 2. 게임 진행 ===================== */

// 랜덤 문제 만들기 (같은 문제가 바로 연달아 나오지 않게)
function makeQuestions() {
  const dans = [...selectedDans];
  const list = [];
  for (let i = 0; i < questionCount; i++) {
    let q;
    do {
      q = { a: dans[Math.floor(Math.random() * dans.length)], b: 1 + Math.floor(Math.random() * 9) };
    } while (list.length && list[list.length - 1].a === q.a && list[list.length - 1].b === q.b && dans.length * 9 > 1);
    list.push(q);
  }
  return list;
}

function startGame() {
  unlockSound();
  questions = makeQuestions();
  current = 0; score = 0; combo = 0; correctCount = 0; wrongOnes = [];
  playing = true;
  showScreen("game");
  updateTopbar();
  showQuestion();
}

function stopGame() {
  playing = false;
  stopListening();
}

function showQuestion() {
  const q = questions[current];
  $("qText").textContent = `${q.a} × ${q.b} =`;
  typed = "";
  $("answerBox").textContent = "?";
  $("message").textContent = "";
  $("message").className = "message";
  busy = false;
  unclearCount = 0;
  questionStartTime = performance.now();
  clearTimeout(matchTimer);
  if (SpeechRecognition && !micBlocked) setMic(false, "준비…");

  // 문제를 소리로 읽어 주기: "칠 곱하기 팔은?"
  // 빨리 맞히기 시간은 다 읽어 준 다음부터 잽니다
  const thisQuestion = current;
  speak(`${toSino(q.a)} 곱하기 ${toSino(q.b)}${josaEunNeun(q.b)}?`).then(() => {
    if (thisQuestion === current && !busy) questionStartTime = performance.now();
  });
  // 답 듣기 시작 (읽어 주는 중이면 다 읽은 뒤에 마이크가 켜짐)
  listen(quizHeard, "듣고 있어요… 답을 말해 보세요!");
}

function updateTopbar() {
  $("countText").textContent = `${Math.min(current + 1, questions.length)} / ${questions.length}`;
  $("scoreText").textContent = score;
  $("comboText").textContent = `🔥 ${combo}`;
  $("progressBar").style.width = (current / questions.length) * 100 + "%";
}

// 답을 받았을 때 (말하기든 숫자 누르기든 여기로 옴)
function submitAnswer(value) {
  if (busy || !playing) return;
  busy = true;
  clearTimeout(matchTimer);
  stopListen(); // 채점하는 동안 마이크 끄기
  const q = questions[current];
  const answer = q.a * q.b;
  const seconds = (performance.now() - questionStartTime) / 1000;
  const card = $("questionCard");
  const stamp = $("stamp");

  card.classList.remove("good-flash", "bad-flash");
  stamp.className = "stamp";
  void card.offsetWidth; // 애니메이션을 다시 시작하기 위한 작은 요령

  if (value === answer) {
    combo++;
    correctCount++;
    let gained = POINT_CORRECT;
    let text = "딩동댕! 맞았어요 👍";
    if (seconds <= FAST_SECONDS) { gained += POINT_FAST; text = `⚡ 번개처럼 빨라요! +${gained}`; }
    else { text = `맞았어요! +${gained}`; }
    if (combo >= 3) text += `  🔥${combo}연속!`;
    score += gained;
    $("answerBox").textContent = answer;
    $("message").textContent = text;
    $("message").className = "message good";
    stamp.textContent = "⭕";
    stamp.classList.add("good");
    card.classList.add("good-flash");
    playSound(true);
  } else {
    combo = 0;
    wrongOnes.push(q);
    $("answerBox").textContent = answer;
    $("message").textContent = `아쉬워요! ${q.a} × ${q.b} = ${answer} 이에요` + (value != null ? ` (내 답: ${value})` : "");
    $("message").className = "message bad";
    stamp.textContent = "❌";
    stamp.classList.add("bad");
    card.classList.add("bad-flash");
    playSound(false);
  }
  updateTopbar();

  // 소리로 알려 주기: 맞으면 "맞았어요!", 틀리면 "칠 팔 오십육" 처럼 정답을 외워 줌
  const talk = value === answer
    ? speak("맞았어요!")
    : speak(`${toSino(q.a)} ${toSino(q.b)} ${toSino(answer)}`);
  // 틀렸을 땐 정답을 조금 더 오래 보여줌. 말하는 게 끝날 때까지도 기다림
  const wait = new Promise((r) => setTimeout(r, value === answer ? FEEDBACK_MS : FEEDBACK_MS + 1300));
  const thisQuestion = current;
  Promise.all([talk, wait]).then(() => { if (thisQuestion === current) nextQuestion(); });
}

function nextQuestion() {
  if (!playing) return;
  current++;
  if (current >= questions.length) { finishGame(); return; }
  updateTopbar();
  showQuestion();
}

function finishGame() {
  stopGame();
  $("progressBar").style.width = "100%";
  const total = questions.length;
  const ratio = correctCount / total;
  const starCount = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : ratio > 0 ? 1 : 0;
  $("stars").textContent = "⭐".repeat(starCount) + "☆".repeat(3 - starCount);
  $("finalScore").textContent = score;
  $("finalDetail").textContent = `${total}문제 중 ${correctCount}문제 맞혔어요!`;

  const best = getBest();
  if (score > best) { setBest(score); $("newBest").textContent = "🏆 최고 점수를 새로 세웠어요!"; }
  else { $("newBest").textContent = ""; }

  // 틀린 문제 목록 (중복 없이)
  const seen = new Set();
  $("wrongList").innerHTML = "";
  wrongOnes.forEach((q) => {
    const key = q.a + "x" + q.b;
    if (seen.has(key)) return;
    seen.add(key);
    const span = document.createElement("span");
    span.textContent = `${q.a} × ${q.b} = ${q.a * q.b}`;
    $("wrongList").appendChild(span);
  });
  $("wrongCard").style.display = wrongOnes.length ? "" : "none";
  showScreen("result");
  speak(`다 풀었어요! ${correctCount}문제 맞혔어요. ${toSino(score)}점!`);
}

/* ===================== 순서대로 외우기 ===================== */
/* ① 듣고 따라 하기: "칠 이 십사" 를 듣고 따라 말해요 (답이 다 보여요)
   ② 가리고 말하기: 답을 가리고 순서대로 말해요 ("칠 삼은?" → "이십일")
   다 끝나면 그 단만 섞어서 문제 풀기로 넘어갈 수 있어요. */

let learnDan = 2;
let learnStage = 1;
let learnRow = 1;          // 지금 몇 번째 줄 (×1 ~ ×9)
let learnActive = false;
let learnRevealed = false; // ②단계에서 지금 줄 답을 보여 줬는지
let learnRows = {};        // 줄마다 결과: "done"(혼자 함) / "help"(도움 받음)
let learnTimer = null;
const PRAISE = ["잘했어요! 👍", "최고예요! 🌟", "멋져요! 😆", "딩동댕! 🎵", "좋아요! 💪"];

// 구구단 외우는 말: 7×2 → "칠 이 십사", 2×3 → "이 삼은 육" (답이 한 자리면 '은/는' 붙이기)
function chantText(a, b) {
  const p = a * b;
  return `${toSino(a)} ${toSino(b)}${p < 10 ? josaEunNeun(b) : ""} ${toSino(p)}`;
}
function askText(a, b) {
  return `${toSino(a)} ${toSino(b)}${josaEunNeun(b)}?`;
}

// 단 고르기 버튼 (외우기 화면 위쪽)
for (let d = 2; d <= 9; d++) {
  const btn = document.createElement("button");
  btn.textContent = d;
  btn.dataset.dan = d;
  btn.onclick = () => { learnDan = d; startLearn(1); };
  $("learnDanButtons").appendChild(btn);
}

$("learnBtn").onclick = () => {
  unlockSound();
  learnDan = selectedDans.size ? Math.min(...selectedDans) : 2;
  showScreen("learn");
  startLearn(1);
};
$("learnBackBtn").onclick = () => { stopLearn(); showScreen("start"); showBest(); };
$("stage1Btn").onclick = () => startLearn(1);
$("stage2Btn").onclick = () => startLearn(2);
$("replayBtn").onclick = () => {
  if (!learnActive) return;
  const a = learnDan, b = learnRow;
  speak(learnStage === 1 || learnRevealed ? chantText(a, b) : askText(a, b));
};
$("learnNextBtn").onclick = () => {
  if (!learnActive) return;
  if (learnStage === 2 && !learnRevealed) { learnShowAnswer(); return; } // 먼저 정답 보여 주기
  if (!learnRows[learnRow]) learnRows[learnRow] = learnStage === 1 ? "done" : "help";
  learnAdvance();
};

function startLearn(stage) {
  stopTalking();
  clearTimeout(learnTimer);
  learnActive = true;
  learnStage = stage;
  learnRow = 1;
  learnRows = {};
  $("learnTitle").textContent = `${learnDan}단 외우기`;
  document.querySelectorAll("#learnDanButtons button").forEach((b) => b.classList.toggle("on", Number(b.dataset.dan) === learnDan));
  $("stage1Btn").classList.toggle("on", stage === 1);
  $("stage2Btn").classList.toggle("on", stage === 2);
  $("learnDone").hidden = true;
  $("learnControls").hidden = false;
  learnStep();
}

function stopLearn() {
  learnActive = false;
  clearTimeout(learnTimer);
  stopListening();
  stopTalking();
}

function setLearnMsg(text, kind = "") {
  $("learnMsg").textContent = text;
  $("learnMsg").className = "message " + kind;
}

// 지금 줄 시작
function learnStep() {
  clearTimeout(learnTimer);
  const a = learnDan, b = learnRow;
  learnRevealed = learnStage === 1;
  renderLearn();
  if (learnStage === 1) {
    setLearnMsg("잘 듣고 따라 말해 보세요 👂");
    speak(chantText(a, b));
    listen(learnHeard, "🎤 따라 말해 보세요!");
  } else {
    setLearnMsg("정답은 얼마일까요? 🤔");
    speak(askText(a, b));
    listen(learnHeard, "🎤 정답을 말해 보세요!");
  }
}

function learnHeard(info) {
  if (!learnActive) return;
  const a = learnDan, b = learnRow;
  // 외우기에서는 "칠이십사" 처럼 통째로 말해도, "십사" 만 말해도 맞아요
  const chant = chantText(a, b).replace(/\s+/g, "");
  judge(info, a * b, learnRight, learnWrong, () => {
    setLearnMsg("🤔 잘 못 들었어요. 한 번 더 말해 볼래요?");
    listen(learnHeard, learnStage === 1 || learnRevealed ? "🎤 따라 말해 보세요!" : "🎤 정답을 말해 보세요!");
  }, [chant], { a, b });
}

// 맞게 말했어요 → 잠깐 칭찬하고 다음 줄로
function learnRight() {
  stopListen();
  learnRevealed = true;
  if (!learnRows[learnRow]) learnRows[learnRow] = "done";
  renderLearn();
  playSound(true);
  setLearnMsg(PRAISE[Math.floor(Math.random() * PRAISE.length)], "good");
  const row = learnRow;
  learnTimer = setTimeout(() => { if (learnActive && learnRow === row) learnAdvance(); }, 700);
}

// 다르게 말했어요 → 정답을 다시 들려주고 한 번 더 따라 하기
function learnWrong() {
  stopListen();
  playSound(false);
  learnShowAnswer(`한 번 더! ${learnDan} × ${learnRow} = ${learnDan * learnRow}`);
}

// 정답을 보여 주고 들려준 다음, 따라 말하기를 기다려요
function learnShowAnswer(msg) {
  const a = learnDan, b = learnRow;
  learnRevealed = true;
  learnRows[b] = "help";
  renderLearn();
  setLearnMsg(msg || `정답은 ${a * b}! 따라 말해 볼까요?`, "bad");
  speak(chantText(a, b));
  listen(learnHeard, "🎤 따라 말해 보세요!");
}

function learnAdvance() {
  stopListen();
  if (learnRow < 9) { learnRow++; learnStep(); }
  else finishLearnStage();
}

// 표 그리기
function renderLearn() {
  const t = $("learnTable");
  t.innerHTML = "";
  for (let b = 1; b <= 9; b++) {
    const state = learnRows[b];
    const isCur = b === learnRow && !$("learnControls").hidden;
    const showAns = learnStage === 1 || !!state || (isCur && learnRevealed);
    const row = document.createElement("div");
    row.className = "lrow" + (isCur ? " cur" : "") + (b < learnRow ? " past" : "") + (state ? " " + state : "");
    row.innerHTML = `<span>${learnDan} × ${b} = <span class="ans">${showAns ? learnDan * b : "?"}</span></span>` +
      `<span class="icon">${state === "done" ? "✅" : state === "help" ? "🟠" : isCur ? "👈" : ""}</span>`;
    t.appendChild(row);
    if (isCur) setTimeout(() => row.scrollIntoView({ block: "nearest", behavior: "smooth" }), 0);
  }
  $("learnNextBtn").textContent = learnStage === 2 && !learnRevealed ? "정답 보기 👀" : "다음 ▶";
}

// 9줄을 다 했어요!
function finishLearnStage() {
  stopListen();
  $("learnControls").hidden = true;
  renderLearn();
  setLearnMsg("");
  setMic(false, "");
  const dan = learnDan;
  const box = $("learnDoneBtns");
  box.innerHTML = "";
  const addBtn = (text, cls, fn) => {
    const b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = fn;
    box.appendChild(b);
  };
  playSound(true);
  if (learnStage === 1) {
    $("learnDoneTitle").textContent = `🎉 ${dan}단을 끝까지 따라 했어요!`;
    addBtn("② 이제 가리고 말해 보기 ▶", "big", () => startLearn(2));
    addBtn("① 한 번 더 따라 하기", "", () => startLearn(1));
    speak(`잘했어요! 이제 답을 가리고 말해 봐요`);
  } else {
    const helped = Object.values(learnRows).filter((v) => v === "help").length;
    $("learnDoneTitle").textContent = helped === 0
      ? `🏆 ${dan}단을 다 외웠어요!`
      : `👏 ${dan}단 끝! 도움 받은 줄: ${helped}개`;
    addBtn(`🎮 ${dan}단 섞어서 문제 풀기`, "big", () => quizOneDan(dan));
    if (helped > 0) addBtn("② 한 번 더 가리고 말하기", "", () => startLearn(2));
    if (dan < 9) addBtn(`📖 ${dan + 1}단 외우러 가기`, "", () => { learnDan = dan + 1; startLearn(1); });
    speak(helped === 0 ? `${toSino(dan)}단을 다 외웠어요! 최고예요` : `잘했어요! 조금만 더 연습해 봐요`);
  }
  $("learnDone").hidden = false;
}

// 외운 단만 섞어서 문제 풀기
function quizOneDan(dan) {
  stopLearn();
  selectedDans = new Set([dan]);
  document.querySelectorAll("#danButtons button").forEach((b) => b.classList.toggle("on", Number(b.dataset.dan) === dan));
  startGame();
}

/* ===================== 3. 숫자 패드 & 키보드 ===================== */

$("pad").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  pressKey(btn.dataset.key || btn.textContent);
});

document.addEventListener("keydown", (e) => {
  if (!screens.game.classList.contains("show")) return;
  if (/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if (e.key === "Backspace") pressKey("del");
  else if (e.key === "Enter") pressKey("ok");
});

function pressKey(key) {
  if (busy) return;
  if (key === "del") typed = typed.slice(0, -1);
  else if (key === "ok") { if (typed) submitAnswer(Number(typed)); return; }
  else if (typed.length < 2) typed += key;
  $("answerBox").textContent = typed || "?";
}

/* ===================== 4. 소리 효과 (딩동댕 / 삐) ===================== */

let audioCtx = null;
function unlockSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function beep(freq, start, dur, type = "sine") {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + start);
  osc.stop(audioCtx.currentTime + start + dur);
}
function playSound(good) {
  if (!audioCtx) return;
  try {
    if (good) { beep(784, 0, 0.15); beep(988, 0.12, 0.15); beep(1319, 0.24, 0.3); }
    else { beep(220, 0, 0.35, "square"); }
  } catch (e) {}
}

/* ===================== 5. 소리로 읽어 주기 (음성 합성) ===================== */

let talking = false;   // 지금 화면이 말하는 중인지
let talkId = 0;        // 가장 최근 말하기 번호 (예전 말이 끝난 신호와 헷갈리지 않게)
let koreanVoice = null;

function pickKoreanVoice() {
  if (!window.speechSynthesis) return;
  const voices = speechSynthesis.getVoices();
  koreanVoice = voices.find((v) => /^ko/i.test(v.lang)) || null;
}
if (window.speechSynthesis) {
  pickKoreanVoice();
  speechSynthesis.onvoiceschanged = pickKoreanVoice;
}

// 글자를 소리 내어 읽기. 다 읽으면 끝났다고 알려 줌(Promise)
function speak(text) {
  return new Promise((resolve) => {
    if (!voiceOn || !window.speechSynthesis) { resolve(); return; }
    const id = ++talkId;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    if (koreanVoice) u.voice = koreanVoice;
    u.rate = 0.95;  // 아이들이 알아듣기 쉽게 살짝 천천히
    u.pitch = 1.15; // 살짝 밝은 목소리
    talking = true;
    syncMic(); // 말하는 동안에는 마이크 끄기 (내 목소리를 답으로 착각하지 않게)
    if (listenFor) setMic(false, "🔊 잘 들어 보세요…");
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      // 스피커 소리가 마이크에 남아 있을 수 있어 아주 잠깐 더 기다림
      setTimeout(() => {
        if (id === talkId) {
          talking = false;
          syncMic(); // 다 말했으면 마이크 켜기
        }
        resolve();
      }, 200);
    };
    u.onend = finish;
    u.onerror = finish;
    setTimeout(finish, 1500 + text.length * 250); // 끝났다는 신호가 안 오는 기기를 위한 안전장치
    speechSynthesis.speak(u);
  });
}

function stopTalking() {
  talkId++;
  talking = false;
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (micSystemReady) syncMic();
}

// 숫자를 한자어로 읽기: 56 → "오십육"
function toSino(n) {
  const d = ["영", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
  if (n === 0) return "영";
  let out = "";
  const hundreds = Math.floor(n / 100), tens = Math.floor((n % 100) / 10), ones = n % 10;
  if (hundreds) out += (hundreds > 1 ? d[hundreds] : "") + "백";
  if (tens) out += (tens > 1 ? d[tens] : "") + "십";
  if (ones) out += d[ones];
  return out;
}
// "팔은", "구는" 처럼 숫자 뒤에 붙는 말 고르기 (받침이 있으면 "은")
function josaEunNeun(n) {
  const last = toSino(n).slice(-1);
  const hasBatchim = (last.charCodeAt(0) - 0xac00) % 28 !== 0;
  return hasBatchim ? "은" : "는";
}

if (!window.speechSynthesis) {
  document.querySelector("#voiceButtons").closest(".card").style.display = "none";
  document.querySelectorAll(".voice-toggle").forEach((b) => { b.style.display = "none"; });
}
setVoice(voiceOn);

/* ===================== 6. 말로 답하기 (음성 인식) ===================== */

/* 동작 방식 (간단하게!)
   - 문제를 다 읽어 준 다음 마이크를 "새로" 켭니다.
   - 답이 들리면 채점하고, 정답을 알려 주는 동안에는 마이크를 끕니다.
   - 다음 문제가 나오면 다시 새로 켭니다.
   이렇게 문제마다 새로 켜야 휴대폰(특히 안드로이드)에서도 이전 문제의 말과 섞이지 않아요. */

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micActive = false;     // 마이크가 켜져 있거나 켜지는 중인지
let micBlocked = false;    // 사용자가 마이크를 막았는지
var micSystemReady = false; // 마이크 관련 코드가 다 준비됐는지
let micFor = -1;           // 지금 켜진 마이크가 어떤 "듣기"용인지 (번호)
let micRetryTimer = null;
let lastMicError = null;
let matchTimer = null;
let listenFor = null;      // 지금 기다리는 답: { id, handler, prompt }
let listenSeq = 0;

if (!SpeechRecognition) {
  $("micSupportText").textContent =
    "⚠️ 이 브라우저는 구글 말 알아듣기를 지원하지 않아요. ④에서 위스퍼 AI를 고르거나 숫자 버튼으로 답해 주세요.";
}

// 마이크 상태 글자 바꾸기 (게임 화면, 외우기 화면 모두)
function setMic(on, text) {
  document.querySelectorAll(".mic").forEach((el) => el.classList.toggle("on", on));
  document.querySelectorAll(".mic-text").forEach((el) => { el.innerHTML = text; });
}

// 답 듣기 시작: handler 는 들린 말을 받아서 채점하는 함수
function listen(handler, prompt) {
  clearTimeout(matchTimer);
  listenFor = { id: ++listenSeq, handler, prompt };
  if (talking) setMic(false, "🔊 잘 들어 보세요…");
  syncMic();
}
// 답 듣기 멈추기
function stopListen() {
  clearTimeout(matchTimer);
  listenFor = null;
  syncMic();
}

// 지금 마이크를 켜 둬야 하는 때인지
function shouldListen() {
  if (!listenFor || talking || micBlocked) return false;
  return speechEngine === "whisper" ? whisperReady : !!SpeechRecognition;
}

function makeRecognition() {
  const r = new SpeechRecognition();
  r.lang = "ko-KR";
  r.continuous = false;      // 한 번 말하면 끝 → 문제마다 새로 켜서 깔끔하게
  r.interimResults = true;   // 말하는 중간에도 결과 받기 → 더 빠른 채점
  r.maxAlternatives = 5;     // 비슷하게 들린 후보도 같이 받기
  r.onstart = () => {
    if (shouldListen()) setMic(true, listenFor.prompt);
  };
  r.onresult = handleSpeech;
  r.onerror = (e) => {
    lastMicError = e.error;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      micBlocked = true;
      setMic(false, "🙅 마이크 사용이 막혀 있어요. 버튼으로 해 주세요.");
    }
  };
  r.onend = () => {
    micActive = false;
    // 아직 답을 기다리는 중이면 (조용해서 저절로 꺼진 경우 등) 다시 켜기
    // (마이크 오류가 났을 땐 조금 쉬었다가 다시 켜기)
    const trouble = lastMicError && lastMicError !== "no-speech" && lastMicError !== "aborted";
    lastMicError = null;
    clearTimeout(micRetryTimer);
    micRetryTimer = setTimeout(syncMic, trouble ? 1000 : 150);
  };
  return r;
}

// 상황에 맞게 마이크를 켜거나 끄기
function syncMic() {
  if (speechEngine === "whisper") { syncWhisperMic(); return; }
  if (!SpeechRecognition) {
    if (listenFor) setMic(false, learnActive ? "👉 다 따라 했으면 [다음 ▶]을 눌러요" : "🎹 숫자 버튼을 눌러 답해요");
    return;
  }
  if (shouldListen()) {
    // 이전 "듣기"용으로 켜진 마이크면 끄고 새로 켜기 (끝나면 onend에서 다시 이 함수가 불림)
    if (micActive && micFor !== listenFor.id) { try { recognition.abort(); } catch (e) {} return; }
    if (micActive) return;
    if (!recognition) recognition = makeRecognition();
    micFor = listenFor.id;
    micActive = true;
    try { recognition.start(); } catch (e) { micActive = false; }
  } else if (micActive) {
    try { recognition.abort(); } catch (e) {}
  }
}

function stopListening() {
  clearTimeout(matchTimer);
  clearTimeout(micRetryTimer);
  listenFor = null;
  if (recognition && micActive) { try { recognition.abort(); } catch (e) {} }
  releaseWhisperMic();
  setMic(false, "");
}

function handleSpeech(event) {
  // 이전 "듣기"용 마이크에서 온 말, 화면이 말하는 중에 들린 말은 무시
  if (!shouldListen() || micFor !== listenFor.id) return;
  const target = listenFor;

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const result = event.results[i];
    const heardTexts = [];
    for (let k = 0; k < result.length; k++) heardTexts.push(result[k].transcript);
    deliverHeard(target, heardTexts, result.isFinal);
    if (listenFor !== target) return; // 채점이 끝났으면 그만
  }
}

// 들린 말(구글이든 위스퍼든)을 채점하는 곳으로 넘기기
function deliverHeard(target, heardTexts, isFinal) {
  const shown = (heardTexts[0] || "").trim();
  if (shown) setMic(true, `들린 말: <span class="heard">"${escapeHtml(shown)}"</span>`);
  const candidates = new Set();
  heardTexts.forEach((t) => parseKoreanNumbers(t).forEach((n) => candidates.add(n)));
  const first = parseKoreanNumbers(heardTexts[0] || "")[0];
  target.handler({ candidates, texts: heardTexts, isFinal, first: first != null ? first : [...candidates][0] });
}

// 들린 말을 채점하는 도우미
//  - 정답 숫자가 그대로 들리면 → 바로 맞음
//  - 아니면 "소리가 얼마나 비슷한지" 비교해서 맞음 / 틀림 / 잘 모르겠음 을 정해요
//  extraTargets: 정답 말고도 맞다고 볼 소리 (예: 외우기 모드의 "칠이십사")
function judge(info, answer, onRight, onWrong, onUnclear, extraTargets = [], q = null) {
  const id = listenFor && listenFor.id;
  if (info.candidates.has(answer)) {
    // 정답이 들렸어요! 말이 아직 이어지는 중일 수 있으니 아주 잠깐만 기다렸다가 채점
    // (예: 정답이 20인데 "이십일"이라고 말하는 중일 수 있어서)
    clearTimeout(matchTimer);
    if (info.isFinal) { onRight(); return; }
    matchTimer = setTimeout(() => { if (listenFor && listenFor.id === id) onRight(); }, 350);
    return;
  }
  clearTimeout(matchTimer);
  if (!info.isFinal) return; // 말이 끝날 때까지 기다리기

  const v = soundVerdict(info.texts, answer, extraTargets, q);
  if (v.verdict === "right") onRight();
  else if (v.verdict === "wrong") onWrong(v.number);
  else if (v.verdict === "unclear" && onUnclear) onUnclear();
}

/* ----- 소리가 비슷한지 비교하기 -----
   음성 인식은 아이 발음을 "오시뷰", "5 16", "오십 유" 처럼 엉뚱하게 받아 적기도 해요.
   그래서 글자를 자음·모음으로 쪼갠 뒤, 정답 소리("오십육")와 얼마나 다른지 점수를 매겨요.
   0 이면 똑같고, 1 에 가까울수록 많이 달라요. */
const CHO_LIST = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG_LIST = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG_LIST = ["", "ㄱ", "ㄱ", "ㄱ", "ㄴ", "ㄴ", "ㄴ", "ㄷ", "ㄹ", "ㄱ", "ㅁ", "ㄹ", "ㄹ", "ㄹ", "ㅂ", "ㄹ",
                   "ㅁ", "ㅂ", "ㅂ", "ㄷ", "ㄷ", "ㅇ", "ㄷ", "ㄷ", "ㄱ", "ㄷ", "ㅂ", "ㄷ"]; // 받침은 소리 나는 대로
// 비슷하게 들리는 소리 묶음
const SOUND_GROUP = {
  ㄱ: "K", ㄲ: "K", ㅋ: "K", ㄷ: "T", ㄸ: "T", ㅌ: "T", ㅂ: "P", ㅃ: "P", ㅍ: "P",
  ㅅ: "S", ㅆ: "S", ㅈ: "J", ㅉ: "J", ㅊ: "J",
  ㅐ: "E", ㅔ: "E", ㅒ: "YE", ㅖ: "YE", ㅙ: "WE", ㅚ: "WE", ㅞ: "WE",
};
const NATIVE_READ = ["", "하나", "둘", "셋", "넷", "다섯", "여섯", "일곱", "여덟", "아홉", "열"];

// "오십육" → [ㅇ,ㅗ,ㅅ,ㅣ,ㅂ(받침),ㅇ,ㅠ,ㄱ(받침)]
function toJamo(word) {
  const out = [];
  for (const ch of word) {
    const code = ch.charCodeAt(0) - 0xac00;
    if (code < 0 || code > 11171) continue;
    out.push({ j: CHO_LIST[Math.floor(code / 588)], kind: "c" });
    out.push({ j: JUNG_LIST[Math.floor((code % 588) / 28)], kind: "v" });
    const jong = JONG_LIST[code % 28];
    if (jong) out.push({ j: jong, kind: "f" });
  }
  return out;
}

function swapCost(a, b) {
  if (a.j === b.j) return 0;
  if ((a.kind === "v") !== (b.kind === "v")) return 1.5;       // 자음 ↔ 모음
  if (SOUND_GROUP[a.j] && SOUND_GROUP[a.j] === SOUND_GROUP[b.j]) return 0.3; // ㅂ/ㅍ 처럼 비슷한 소리
  return 1;
}
function dropCost(t) {
  if (t.kind === "c" && t.j === "ㅇ") return 0.2; // 소리 없는 ㅇ
  if (t.kind === "f" || t.j === "ㅎ") return 0.5; // 받침, ㅎ 은 잘 안 들려요
  return 1;
}
// 두 소리가 얼마나 다른지 (0 = 똑같음)
function soundDistance(a, b) {
  const A = toJamo(a), B = toJamo(b);
  if (!A.length || !B.length) return 1;
  const d = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
  for (let i = 1; i <= A.length; i++) d[i][0] = d[i - 1][0] + dropCost(A[i - 1]);
  for (let j = 1; j <= B.length; j++) d[0][j] = d[0][j - 1] + dropCost(B[j - 1]);
  for (let i = 1; i <= A.length; i++) {
    for (let j = 1; j <= B.length; j++) {
      d[i][j] = Math.min(
        d[i - 1][j] + dropCost(A[i - 1]),
        d[i][j - 1] + dropCost(B[j - 1]),
        d[i - 1][j - 1] + swapCost(A[i - 1], B[j - 1]),
      );
    }
  }
  return d[A.length][B.length] / Math.max(A.length, B.length);
}

// 들린 말을 "읽는 소리"로 바꾸기: "5 16이요" → "오십육이요"
function toReading(text) {
  return text
    .replace(/\d+/g, (num) => (num.length <= 3 ? toSino(Number(num)) : num))
    .replace(/[^가-힣]/g, "");
}

// 앞뒤에 붙은 말을 떼어 본 여러 모양 ("정답은 오십육이요" → "오십육" 등)
function readingVariants(reading, q) {
  const set = new Set([reading]);
  const ends = ["입니다", "이에요", "예요", "이요", "이야", "요", "야", "이다", "다"];
  const starts = ["정답은", "답은", "음", "어", "으"];
  [...set].forEach((r) => ends.forEach((e) => { if (r.endsWith(e) && r.length > e.length) set.add(r.slice(0, -e.length)); }));
  [...set].forEach((r) => starts.forEach((st) => { if (r.startsWith(st) && r.length > st.length) set.add(r.slice(st.length)); }));
  // 문제까지 같이 말한 경우 끝부분만 떼어 보기 ("칠 팔 오십육" → "오십육")
  // 단, 앞부분에 문제 숫자(칠, 팔)가 들어 있을 때만! ("오십육" 에서 "육"만 떼면 안 되니까)
  if (q) {
    const qa = toSino(q.a), qb = toSino(q.b);
    [...set].forEach((r) => {
      for (let k = 1; k < r.length && k <= 4; k++) {
        const head = r.slice(0, -k);
        const ia = head.indexOf(qa);
        if (ia >= 0 && head.indexOf(qb, ia + qa.length) >= 0) set.add(r.slice(-k));
      }
    });
  }
  return [...set].filter(Boolean);
}

// 들린 말들(후보 여러 개)을 보고 맞음 / 틀림 / 잘 모르겠음 정하기
function soundVerdict(texts, answer, extraTargets = [], q = null) {
  const targets = [toSino(answer), ...extraTargets];
  if (answer <= 10) targets.push(NATIVE_READ[answer]);

  let bestAns = 1;                       // 정답 소리와 가장 가까운 정도
  let bestOther = { d: 1, n: null };     // 다른 숫자 소리와 가장 가까운 정도
  let exactWrong = null;                 // 숫자로 똑똑히 들린 다른 답
  texts.forEach((text, idx) => {
    const reading = toReading(text);
    if (!reading) return;
    const variants = readingVariants(reading, q);
    variants.forEach((v) => targets.forEach((t) => {
      // 끝부분만 떼어 본 짧은 모양은 정답과 길이가 비슷할 때만 비교
      if (v !== reading && Math.abs(v.length - t.length) > 1) return;
      bestAns = Math.min(bestAns, soundDistance(v, t));
    }));
    if (idx === 0) {
      const nums = parseKoreanNumbers(text).filter((n) => n !== answer && n >= 1 && n <= 90);
      // 숫자로 들린 다른 답 (들린 말 대부분이 그 숫자일 때만. "안녕하세요"의 "세" 같은 건 빼기)
      const clear = nums.find((n) => soundDistance(reading, toSino(n)) <= 0.5 ||
        (n <= 10 && soundDistance(reading, NATIVE_READ[n]) <= 0.5));
      if (clear != null) exactWrong = clear;
      for (let n = 1; n <= 90; n++) {
        if (n === answer) continue;
        const t = toSino(n);
        variants.forEach((v) => {
          if (v !== reading && Math.abs(v.length - t.length) > 0) return;
          const d = soundDistance(v, t);
          // 더 비슷한 숫자, 똑같이 비슷하면 더 긴 숫자 고르기 ("십오" 가 "오" 보다 우선)
          if (d < bestOther.d || (d === bestOther.d && bestOther.n != null && t.length > toSino(bestOther.n).length)) bestOther = { d, n };
        });
      }
    }
  });

  // 정답 소리와 충분히 비슷하고, 다른 숫자보다 더 비슷하면 → 맞음 (애매하면 아이 편!)
  if (bestAns <= 0.35 && bestAns <= bestOther.d + 0.05) return { verdict: "right" };
  // 다른 숫자가 분명하게 들렸으면 → 틀림
  if (bestOther.d <= 0.15 && bestOther.d < bestAns) return { verdict: "wrong", number: bestOther.n };
  if (exactWrong != null && bestAns > 0.45) return { verdict: "wrong", number: exactWrong };
  // 그 밖에는 잘 못 알아들은 것 → 다시 말해 달라고 하기
  const anything = texts.some((t) => toReading(t).length > 0);
  return { verdict: anything ? "unclear" : "silent" };
}

// 문제 풀기에서 들린 말 채점
function quizHeard(info) {
  if (busy || !playing) return;
  const q = questions[current];
  const answer = q.a * q.b;
  judge(info, answer, () => submitAnswer(answer), (v) => submitAnswer(v), () => {
    // 잘 못 알아들었어요 → 틀렸다고 하지 않고 다시 들어요
    unclearCount++;
    $("message").textContent = unclearCount >= 2
      ? "🤔 잘 못 들었어요. 크게 또박또박! (숫자 버튼도 돼요)"
      : "🤔 잘 못 들었어요. 다시 말해 줄래요?";
    $("message").className = "message";
    listen(quizHeard, "듣고 있어요… 다시 말해 보세요!");
  }, [], q);
}
let unclearCount = 0;

/* ===================== 7. 위스퍼 AI (휴대폰 안에서 알아듣기) ===================== */
/* 구글 대신 "위스퍼(Whisper)"라는 AI를 휴대폰 브라우저 안에서 직접 돌려요.
   - 처음 한 번 AI 파일을 내려받아요 (가볍게 41MB / 똑똑하게 77MB). 그다음부터는 저장돼 있어서 빨라요.
   - 아이 목소리가 휴대폰 밖으로 나가지 않아요.
   흐름: 마이크 소리를 계속 듣다가 → 말소리가 시작되면 녹음 → 조용해지면 녹음 끝
         → 위스퍼에게 "뭐라고 했어?" 물어보기 → 받아 적은 글자를 채점 */

const WHISPER_MODELS = { tiny: "onnx-community/whisper-tiny", base: "onnx-community/whisper-base" };
const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";
let speechEngine = loadPref("gugudan-engine", "google");   // "google" 또는 "whisper"
let whisperSize = loadPref("gugudan-whisper-size", "base"); // "tiny" 또는 "base"
let whisperWorker = null;
let whisperReady = false;
let whisperLoadedSize = null;
let whisperPercent = 0;
let whisperError = "";
let whisperJobId = 0;
const whisperJobs = new Map();

function loadPref(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}
function savePref(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

// 위스퍼는 무거워서 화면이 멈추지 않도록 "일꾼(Web Worker)"에게 따로 시켜요
const WHISPER_WORKER_CODE = `
import { pipeline, env } from "${TRANSFORMERS_URL}";
env.allowLocalModels = false;
let asr = null;
const files = {};
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "load") {
    try {
      asr = await pipeline("automatic-speech-recognition", m.model, {
        dtype: "q8",
        device: "wasm",
        progress_callback: (p) => {
          if (p.status === "progress" && p.total) {
            files[p.file] = [p.loaded, p.total];
            let a = 0, b = 0;
            for (const k in files) { a += files[k][0]; b += files[k][1]; }
            self.postMessage({ type: "progress", percent: Math.floor((a / b) * 100) });
          }
        },
      });
      // 첫 번째는 느려서 미리 한 번 연습 삼아 돌려 두기
      await asr(new Float32Array(16000), { language: "korean", task: "transcribe" });
      self.postMessage({ type: "ready" });
    } catch (err) {
      self.postMessage({ type: "error", message: String((err && err.message) || err) });
    }
  } else if (m.type === "run") {
    try {
      const t0 = performance.now();
      // 답은 짧으니 조금만 받아 적게 해요 (같은 말을 끝없이 반복하는 실수 막기)
      const out = await asr(m.audio, { language: "korean", task: "transcribe", max_new_tokens: 12 });
      self.postMessage({ type: "result", id: m.id, text: (out && out.text) || "", ms: Math.round(performance.now() - t0) });
    } catch (err) {
      self.postMessage({ type: "result", id: m.id, text: "", error: String(err) });
    }
  }
};`;

function loadWhisper() {
  if (whisperWorker && whisperLoadedSize === whisperSize) return;
  if (whisperWorker) { whisperWorker.terminate(); whisperWorker = null; }
  whisperReady = false;
  whisperError = "";
  whisperPercent = 0;
  whisperLoadedSize = whisperSize;
  try {
    const url = URL.createObjectURL(new Blob([WHISPER_WORKER_CODE], { type: "text/javascript" }));
    whisperWorker = new Worker(url, { type: "module" });
  } catch (e) {
    whisperError = "이 브라우저에서는 위스퍼를 쓸 수 없어요";
    updateEngineUI();
    return;
  }
  whisperWorker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "progress") { whisperPercent = m.percent; updateEngineUI(); }
    else if (m.type === "ready") { whisperReady = true; updateEngineUI(); syncMic(); }
    else if (m.type === "error") { whisperError = m.message; updateEngineUI(); }
    else if (m.type === "result") {
      const job = whisperJobs.get(m.id);
      whisperJobs.delete(m.id);
      if (job) job(m);
    }
  };
  whisperWorker.onerror = () => { whisperError = "위스퍼를 불러오지 못했어요 (인터넷 확인)"; updateEngineUI(); };
  whisperWorker.postMessage({ type: "load", model: WHISPER_MODELS[whisperSize] });
  updateEngineUI();
}

function whisperTranscribe(audio16k) {
  return new Promise((resolve) => {
    const id = ++whisperJobId;
    whisperJobs.set(id, resolve);
    whisperWorker.postMessage({ type: "run", id, audio: audio16k }, [audio16k.buffer]);
  });
}

function whisperStatusText() {
  if (whisperError) return "😢 " + whisperError;
  if (whisperReady) return "✅ 위스퍼 준비 완료! (휴대폰 안에서 알아들어요)";
  return `🧠 위스퍼 AI 받는 중… ${whisperPercent}% (처음 한 번만 받아요)`;
}

// 시작 화면의 ④번 카드 모양 바꾸기
function updateEngineUI() {
  document.querySelectorAll("#engineButtons button").forEach((b) => b.classList.toggle("on", b.dataset.engine === speechEngine));
  document.querySelectorAll("#whisperSizeButtons button").forEach((b) => b.classList.toggle("on", b.dataset.size === whisperSize));
  $("whisperBox").hidden = speechEngine !== "whisper";
  $("whisperStatus").textContent = whisperStatusText();
  $("whisperBarWrap").hidden = whisperReady || !!whisperError;
  $("whisperBar").style.width = whisperPercent + "%";
  $("engineNote").textContent = speechEngine === "whisper"
    ? "휴대폰 안의 AI가 들어요. 목소리가 밖으로 나가지 않아요. 대신 알아듣는 데 1~3초 걸려요. (가볍게: 빠름 / 똑똑하게: 더 정확)"
    : "구글이 들어요. 빠르지만 인터넷이 필요하고, 목소리가 구글로 보내져요.";
  if (speechEngine === "whisper" && !whisperReady && listenFor) setMic(false, whisperStatusText());
}

document.querySelectorAll("#engineButtons button").forEach((btn) => {
  btn.onclick = () => {

    // 위스퍼를 처음 고르면 빠르게 돌리는 설정을 켜기 위해 화면을 한 번 새로 고쳐요
    if (speechEngine === "whisper" && window.crossOriginIsolated === false && window.isSecureContext && navigator.serviceWorker) {
      $("whisperBox").hidden = false;
      $("whisperStatus").textContent = "🔄 위스퍼 준비를 위해 화면을 새로 고칠게요…";
      setTimeout(() => location.reload(), 400);

});
document.querySelectorAll("#whisperSizeButtons button").forEach((btn) => {

/* ----- 위스퍼용 마이크: 말소리가 시작되고 끝나는 걸 스스로 알아내요 ----- */
const wMic = {
  stream: null, ctx: null, src: null, node: null,
  armed: false,      // 지금 말을 기다리는 중인지
  forId: -1,         // 어떤 "듣기"용인지
  thinking: false,   // 위스퍼가 알아듣는 중인지
  inSpeech: false, chunks: [], pre: [], speechMs: 0, silenceMs: 0, floor: 0.01,
  opening: null,
};

async function openWhisperMic() {
  if (wMic.stream) return true;
  if (wMic.opening) return wMic.opening;
  wMic.opening = (async () => {
    try {
      wMic.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (e) {
      micBlocked = true;
      setMic(false, "🙅 마이크 사용이 막혀 있어요. 버튼으로 해 주세요.");
      return false;
    } finally {
      wMic.opening = null;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    wMic.ctx = new Ctx();
    if (wMic.ctx.state === "suspended") { try { await wMic.ctx.resume(); } catch (e) {} }
    wMic.src = wMic.ctx.createMediaStreamSource(wMic.stream);
    wMic.node = wMic.ctx.createScriptProcessor(2048, 1, 1);
    wMic.node.onaudioprocess = onWhisperAudio;
    wMic.src.connect(wMic.node);
    wMic.node.connect(wMic.ctx.destination); // 소리는 내보내지 않아요 (빈 소리)
    return true;
  })();
  return wMic.opening;
}

function releaseWhisperMic() {
  wMic.armed = false;
  wMic.inSpeech = false;
  if (wMic.stream) {
    try { wMic.node.disconnect(); wMic.src.disconnect(); } catch (e) {}
    wMic.stream.getTracks().forEach((t) => t.stop());
    try { wMic.ctx.close(); } catch (e) {}
    wMic.stream = wMic.ctx = wMic.src = wMic.node = null;
  }
}

function syncWhisperMic() {
  if (!listenFor) { wMic.armed = false; wMic.inSpeech = false; return; }
  if (!whisperReady) { setMic(false, whisperStatusText()); if (!whisperWorker) loadWhisper(); return; }
  if (!shouldListen() || wMic.thinking) { wMic.armed = false; wMic.inSpeech = false; return; }
  const id = listenFor.id;
  openWhisperMic().then((ok) => {
    if (!ok || !listenFor || listenFor.id !== id || !shouldListen() || wMic.thinking) return;
    if (!wMic.armed || wMic.forId !== id) {
      wMic.armed = true;
      wMic.forId = id;
      wMic.inSpeech = false;
      setMic(true, listenFor.prompt);
    }
  });
}

// 마이크 소리가 조금씩 들어올 때마다 불려요
function onWhisperAudio(e) {
  const data = new Float32Array(e.inputBuffer.getChannelData(0));
  const sr = e.inputBuffer.sampleRate;
  const ms = (data.length / sr) * 1000;
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);
  const loud = Math.max(0.02, wMic.floor * 3); // 이것보다 크면 "말소리"

  if (!wMic.inSpeech) {
    // 조용할 때의 소리 크기(배경 소음)를 천천히 배우기
    if (rms < loud) wMic.floor = wMic.floor * 0.95 + rms * 0.05;
    wMic.pre.push(data);
    if (wMic.pre.length > 6) wMic.pre.shift(); // 말 시작 직전 소리도 조금 남겨 두기
    if (wMic.armed && rms > loud) {
      wMic.inSpeech = true;
      wMic.chunks = wMic.pre.slice();
      wMic.speechMs = 0;
      wMic.silenceMs = 0;
    }
    return;
  }
  wMic.chunks.push(data);
  wMic.speechMs += ms;
  wMic.silenceMs = rms < loud * 0.6 ? wMic.silenceMs + ms : 0;
  if (!wMic.armed) { wMic.inSpeech = false; return; }
  if (wMic.silenceMs >= 700 || wMic.speechMs >= 5000) finishWhisperUtterance(sr);
}

// 말이 끝났어요 → 위스퍼에게 물어보기
function finishWhisperUtterance(sr) {
  wMic.inSpeech = false;
  if (wMic.speechMs - wMic.silenceMs < 200) return; // 너무 짧은 소리(기침, 탁 소리)는 무시
  const target = listenFor;
  if (!target || target.id !== wMic.forId) return;
  wMic.armed = false;
  wMic.thinking = true;
  setMic(false, "🧠 알아듣는 중…");
  const audio = resampleTo16k(wMic.chunks, sr);
  wMic.chunks = [];
  whisperTranscribe(audio).then((res) => {
    wMic.thinking = false;
    let text = cleanWhisperText(res.text || "");
    if (listenFor === target) {
      if (text) deliverHeard(target, [text], true);
      else setMic(true, target.prompt);
    }
    syncMic(); // 아직 답을 기다리면 다시 듣기
  });
}

// 위스퍼가 조용한 소리를 듣고 지어내는 말("시청해 주셔서 감사합니다" 등)은 버리기
function cleanWhisperText(text) {
  const t = text.trim();
  if (/감사합니다|시청|구독|좋아요|자막|MBC|KBS|SBS|뉴스/.test(t)) return "";
  return t;
}

// 마이크 소리를 위스퍼가 원하는 모양(1초에 16000개)으로 바꾸기
function resampleTo16k(chunks, sr) {
  let len = 0;
  chunks.forEach((c) => { len += c.length; });
  const all = new Float32Array(len);
  let o = 0;
  chunks.forEach((c) => { all.set(c, o); o += c.length; });
  if (sr === 16000) return all;
  const ratio = sr / 16000;
  const out = new Float32Array(Math.floor(len / ratio));
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio), end = Math.min(len, Math.floor((i + 1) * ratio));
    let s = 0;
    for (let j = start; j < end; j++) s += all[j];
    out[i] = s / Math.max(1, end - start);
  }
  return out;
}

if (speechEngine === "whisper") loadWhisper();
updateEngineUI();

micSystemReady = true;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ----- 들린 말에서 숫자 찾기 -----
   음성 인식은 "21", "이십일", "스물하나", "21이요" 처럼 여러 모양으로 들려줄 수 있어요.
   그래서 가능한 숫자 후보를 모두 찾아서 돌려줍니다. */
const SINO = { 영: 0, 공: 0, 일: 1, 이: 2, 삼: 3, 사: 4, 오: 5, 육: 6, 륙: 6, 칠: 7, 팔: 8, 구: 9 };
const NATIVE_WORDS = [
  ["아흔", 90], ["여든", 80], ["일흔", 70], ["예순", 60], ["쉰", 50], ["마흔", 40], ["서른", 30], ["스물", 20], ["스무", 20], ["열", 10],
  ["다섯", 5], ["여섯", 6], ["일곱", 7], ["여덟", 8], ["아홉", 9], ["하나", 1], ["한", 1], ["둘", 2], ["두", 2], ["셋", 3], ["세", 3], ["석", 3], ["넷", 4], ["네", 4],
];
const ENDINGS = ["입니다", "이에요", "예요", "이요", "이야", "요", "야", "이다", "다", "점"];

function parseKoreanNumbers(text) {
  // 통째로 한 번, 띄어 쓴 낱말마다 한 번씩 숫자를 찾아요 ("칠 이 십사" → 72.., 7, 2, 14)
  const found = parseNumberChunk(text);
  text.split(/\s+/).filter(Boolean).forEach((word) =>
    parseNumberChunk(word).forEach((n) => { if (!found.includes(n)) found.push(n); }));
  return found;
}

function parseNumberChunk(text) {
  const found = [];
  const add = (n) => { if (Number.isInteger(n) && n >= 0 && n <= 100 && !found.includes(n)) found.push(n); };
  const clean = text.replace(/\s+/g, "");

  // ① 숫자로 들린 경우: "21", "21이요"
  (clean.match(/\d+/g) || []).forEach((d) => add(Number(d)));

  // ② 우리말 숫자: "스물하나", "여덟", "열둘"
  const native = parseNative(clean);
  if (native != null) add(native);

  // ③ 한자어 숫자: "이십일", "칠십이"
  ENDINGS.forEach((end) => {
    if (clean.endsWith(end)) {
      const body = clean.slice(0, -end.length);
      if (/^[영공일이삼사오육륙칠팔구십백]+$/.test(body)) add(parseSino(body));
    }
  });
  (clean.match(/[영공일이삼사오육륙칠팔구십백]+/g) || []).forEach((run) => {
    // "이십일이요" 처럼 끝말이 붙은 경우를 위해 끝말을 떼어 본 것을 먼저 후보에 넣기
    ENDINGS.forEach((end) => {
      if (run.endsWith(end) && run.length > end.length) add(parseSino(run.slice(0, -end.length)));
    });
    add(parseSino(run));
  });

  return found;
}

function parseSino(s) {
  let total = 0, cur = null, any = false;
  for (const ch of s) {
    if (ch in SINO) { cur = SINO[ch]; any = true; }
    else if (ch === "십") { total += (cur == null ? 1 : cur) * 10; cur = null; any = true; }
    else if (ch === "백") { total += (cur == null ? 1 : cur) * 100; cur = null; any = true; }
  }
  if (!any) return null;
  return total + (cur || 0);
}

function parseNative(s) {
  let total = 0, i = 0, any = false;
  while (i < s.length) {
    const hit = NATIVE_WORDS.find(([w]) => s.startsWith(w, i));
    if (hit) { total += hit[1]; i += hit[0].length; any = true; }
    else if (any) break;   // 숫자 말이 끝나면 멈춤 ("스물하나요" → 21)
    else i++;
  }
  return any ? total : null;
}
